<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>{{ cliente.nome }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=20260609-v96">

  <script>
    // Formata datas no horário local do navegador, evitando o bug do UTC/toISOString
    // que fazia o botão "Hoje" virar o dia seguinte à noite no Brasil.
    function localISODate(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }
  </script>
  <style>
    :root {
      --cor-primaria: {{ cliente.cor_primaria }};
      --cor-secundaria: {{ cliente.cor_secundaria }};
      --cor-botao: {{ cliente.cor_botao }};
    }
  </style>

  <script>
    // v96: melhora a experiência em tabelas largas sem exigir alteração manual em todos os templates.
    document.addEventListener('DOMContentLoaded', function(){
      document.querySelectorAll('table').forEach(function(tbl){
        if(tbl.closest('.table-wrap,.table-scroll,.scroll-table,.cd-table-wrap,.vtable-wrap,.etable-wrap,.rtable-wrap')) return;
        var wrap = document.createElement('div');
        wrap.className = 'table-wrap auto-table-wrap';
        tbl.parentNode.insertBefore(wrap, tbl);
        wrap.appendChild(tbl);
      });
    });
  </script>

  <!-- v103: ordenamento universal — torna TODAS as colunas de TODAS as tabelas clicáveis -->
  <style>
    table th.cd-sort{cursor:pointer;-webkit-user-select:none;user-select:none}
    table th.cd-sort::after{content:'⇅';font-size:10px;color:#bbb;margin-left:4px;font-weight:400}
    table th.cd-sort.cd-asc::after{content:'↑';color:var(--cor-texto,#1a1a2e)}
    table th.cd-sort.cd-desc::after{content:'↓';color:var(--cor-texto,#1a1a2e)}
  </style>
  <script>
    (function(){
      function valor(txt){
        txt = (txt||'').trim();
        // Data dd/mm/aaaa (com hora opcional) → ordena cronologicamente
        var d = txt.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
        if(d){ return {n: new Date(+d[3], +d[2]-1, +d[1], +(d[4]||0), +(d[5]||0)).getTime()}; }
        // Número (R$, %, código P22/C1...): mantém só dígitos, vírgula e sinal
        if(/[0-9]/.test(txt)){
          var limpo = txt.replace(/[^0-9,\-]/g,'').replace(/\./g,'').replace(',','.');
          var num = parseFloat(limpo);
          if(limpo!=='' && !isNaN(num)) return {n: num};
        }
        return {s: txt.toLowerCase()};
      }
      function ordenar(tabela, idx, th){
        var corpo = tabela.tBodies[0]; if(!corpo) return;
        var linhas = Array.prototype.filter.call(corpo.rows, function(r){ return !r.querySelector('td[colspan]'); });
        var asc = !th.classList.contains('cd-asc');
        tabela.querySelectorAll('th.cd-sort').forEach(function(h){ h.classList.remove('cd-asc','cd-desc'); });
        th.classList.add(asc ? 'cd-asc' : 'cd-desc');
        linhas.sort(function(a,b){
          var ca=a.cells[idx], cb=b.cells[idx];
          var va=valor(ca?ca.textContent:''), vb=valor(cb?cb.textContent:'');
          if('n' in va && 'n' in vb) return asc ? va.n-vb.n : vb.n-va.n;
          var sa=('s' in va)?va.s:String(va.n), sb=('s' in vb)?vb.s:String(vb.n);
          return asc ? sa.localeCompare(sb,'pt-BR') : sb.localeCompare(sa,'pt-BR');
        });
        linhas.forEach(function(r){ corpo.appendChild(r); });
      }
      function ativar(){
        document.querySelectorAll('table').forEach(function(tabela){
          if(tabela.classList.contains('no-sort')) return;
          var cab = tabela.tHead; if(!cab || !cab.rows.length || !tabela.tBodies[0]) return;
          Array.prototype.forEach.call(cab.rows[0].cells, function(th, idx){
            if(th.getAttribute('onclick')) return;        // já tem ordenamento próprio (Vendas/Estoque/Caixa)
            if(!th.textContent.trim()) return;            // coluna sem título (ações, etc.)
            if(th.classList.contains('cd-sort')) return;
            th.classList.add('cd-sort');
            th.addEventListener('click', function(){ ordenar(tabela, idx, th); });
          });
        });
      }
      if(document.readyState!=='loading') ativar();
      else document.addEventListener('DOMContentLoaded', ativar);
    })();
  </script>

  <!-- v106: no celular o menu vira barra horizontal — rola até a aba ativa ficar visível -->
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var ativo = document.querySelector('.nav-item.active');
      if(!ativo) return;
      // Sobe na árvore até achar um contêiner com rolagem horizontal real
      var cont = ativo.parentElement;
      while(cont && cont.scrollWidth <= cont.clientWidth + 2){ cont = cont.parentElement; }
      if(!cont || cont === document.body || cont === document.documentElement) return;
      var cr = cont.getBoundingClientRect();
      var ar = ativo.getBoundingClientRect();
      cont.scrollLeft += (ar.left - cr.left) - (cont.clientWidth/2) + (ar.width/2);
    });
  </script>
</head>
<body>
  {% block content %}{% endblock %}

  {% if session.get('uid') %}
  <!-- MODAL FOTO DE PERFIL (compartilhado) -->
  <div id="modalFotoPerfil" style="display:none;position:fixed;inset:0;background:rgba(26,26,46,.6);z-index:9999;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)" onclick="if(event.target===this)this.style.display='none'">
    <div style="background:#fff;border-radius:18px;max-width:360px;width:100%;padding:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)">
      <div style="font-size:18px;font-weight:800;color:#1a1a2e;margin-bottom:4px">Foto de perfil</div>
      <div style="font-size:12px;color:#aaa;margin-bottom:18px">Carregue uma imagem ou tire uma foto</div>
      <div id="fpPreview" style="width:120px;height:120px;border-radius:50%;margin:0 auto 18px;background:linear-gradient(135deg,var(--cor-primaria,#3949ab),#6a1b9a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;font-weight:700;overflow:hidden">
        {% if usuario_foto %}<img src="/usuarios/avatar?t={{ avatar_v }}" style="width:100%;height:100%;object-fit:cover">{% else %}{{ (nome or '?')[:2]|upper }}{% endif %}
      </div>
      <form method="POST" action="/usuarios/foto" id="fpForm">
        <input type="hidden" name="foto" id="fpFoto">
        <label style="display:inline-flex;align-items:center;gap:8px;justify-content:center;width:100%;padding:12px;background:#eef0fb;color:#3949ab;border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-sizing:border-box">
          📷 Carregar / tirar foto
          <input type="file" accept="image/*" style="display:none" onchange="fpCarregar(this)">
        </label>
        <button type="submit" id="fpSalvar" disabled style="width:100%;margin-top:10px;padding:12px;background:#1a1a2e;color:#fff;border:none;border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;opacity:.5">💾 Salvar foto</button>
      </form>
      <div style="display:flex;gap:10px;margin-top:10px">
        {% if usuario_foto %}
        <form method="POST" action="/usuarios/foto/remover" style="flex:1"><button type="submit" style="width:100%;padding:11px;background:#fff;border:1.5px solid #f3c0c0;color:#c62828;border-radius:10px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;cursor:pointer">🗑️ Remover</button></form>
        {% endif %}
        <button type="button" onclick="document.getElementById('modalFotoPerfil').style.display='none'" style="flex:1;padding:11px;background:#f4f4f6;border:none;color:#888;border-radius:10px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;cursor:pointer">Cancelar</button>
      </div>
    </div>
  </div>
  <script>
  function abrirFotoPerfil(){ document.getElementById('modalFotoPerfil').style.display='flex'; }
  function fpCarregar(input){
    const file = input.files && input.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){ alert('Selecione um arquivo de imagem.'); return; }
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const MAX = 512; let w = img.width, h = img.height;
        if(w > h && w > MAX){ h = Math.round(h*MAX/w); w = MAX; }
        else if(h >= w && h > MAX){ w = Math.round(w*MAX/h); h = MAX; }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const url = c.toDataURL('image/jpeg', 0.85);
        document.getElementById('fpFoto').value = url;
        document.getElementById('fpPreview').innerHTML = '<img src="'+url+'" style="width:100%;height:100%;object-fit:cover">';
        const b = document.getElementById('fpSalvar'); b.disabled = false; b.style.opacity = 1;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  </script>
  {% endif %}
</body>
</html>
